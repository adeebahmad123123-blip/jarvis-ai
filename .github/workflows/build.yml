name: Generate JARVIS Project and Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

              - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      with:
        packages: |
          platform-tools
          platforms;android-34
          build-tools;34.0.0
          cmdline-tools;latest


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate All JARVIS Project Source Files
        run: |
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/java/com/jarvis/ultimate/admin
          mkdir -p app/src/main/java/com/jarvis/ultimate/engine

          # 1. Root build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          # 2. settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "JarvisAIUltimate"
          include(":app")
          EOF

          # 3. app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.jarvis.ultimate"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.jarvis.ultimate"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"

                  vectorDrawables {
                      useSupportLibrary = true
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
                  debug {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.8"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.02.00")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("com.google.code.gson:gson:2.10.1")
          }
          EOF

          # 4. XML Resources
          cat << 'EOF' > app/src/main/res/xml/device_admin_sample.xml
          <device-admin xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-policies>
                  <force-lock />
              </uses-policies>
          </device-admin>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">JARVIS AI ULTIMATE</string>
              <string name="device_admin_label">JARVIS Screen Lock</string>
              <string name="device_admin_description">Urdu command par screen lock karne ki authority.</string>
          </resources>
          EOF

          # 5. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.FLASHLIGHT" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.CALL_PHONE" />

              <queries>
                  <package android:name="com.whatsapp" />
                  <package android:name="com.whatsapp.w4b" />
                  <package android:name="com.google.android.youtube" />
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.DIAL" />
                  </intent>
              </queries>

              <application
                  android:name=".JarvisApplication"
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_dialog_info"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".admin.JarvisDeviceAdminReceiver"
                      android:description="@string/device_admin_description"
                      android:label="@string/device_admin_label"
                      android:permission="android.permission.BIND_DEVICE_ADMIN"
                      android:exported="true">
                      <meta-data
                          android:name="android.app.device_admin"
                          android:resource="@xml/device_admin_sample" />
                      <intent-filter>
                          <action android:name="android.app.action.DEVICE_ADMIN_ENABLED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          # 6. JarvisApplication.kt
          cat << 'EOF' > app/src/main/java/com/jarvis/ultimate/JarvisApplication.kt
          package com.jarvis.ultimate
          import android.app.Application
          class JarvisApplication : Application()
          EOF

          # 7. JarvisDeviceAdminReceiver.kt
          cat << 'EOF' > app/src/main/java/com/jarvis/ultimate/admin/JarvisDeviceAdminReceiver.kt
          package com.jarvis.ultimate.admin
          import android.app.admin.DeviceAdminReceiver
          import android.content.Context
          import android.content.Intent
          import android.widget.Toast
          class JarvisDeviceAdminReceiver : DeviceAdminReceiver() {
              override fun onEnabled(context: Context, intent: Intent) {
                  Toast.makeText(context, "JARVIS Screen Lock Enabled", Toast.LENGTH_SHORT).show()
              }
          }
          EOF

          # 8. DeviceController.kt
          cat << 'EOF' > app/src/main/java/com/jarvis/ultimate/engine/DeviceController.kt
          package com.jarvis.ultimate.engine
          import android.app.admin.DevicePolicyManager
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CameraManager
          import android.media.AudioManager
          import com.jarvis.ultimate.admin.JarvisDeviceAdminReceiver
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class DeviceController(private val context: Context) {
              private val cameraManager = context.getSystemService(Context.CAMERA_SERVICE) as CameraManager
              private val audioManager = context.getSystemService(Context.AUDIO_SERVICE) as AudioManager
              private val devicePolicyManager = context.getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
              private val adminComponent = ComponentName(context, JarvisDeviceAdminReceiver::class.java)

              fun toggleFlashlight(turnOn: Boolean): String {
                  return try {
                      val id = cameraManager.cameraIdList.firstOrNull {
                          cameraManager.getCameraCharacteristics(it).get(CameraCharacteristics.FLASH_INFO_AVAILABLE) == true
                      } ?: return "Camera flash nahi mila, Sir."
                      cameraManager.setTorchMode(id, turnOn)
                      if (turnOn) "Flashlight on kar di gayi hai, Sir." else "Flashlight band kar di gayi hai."
                  } catch (e: Exception) { "Flashlight error: ${e.localizedMessage}" }
              }

              fun adjustVolume(up: Boolean): String {
                  val dir = if (up) AudioManager.ADJUST_RAISE else AudioManager.ADJUST_LOWER
                  audioManager.adjustStreamVolume(AudioManager.STREAM_MUSIC, dir, AudioManager.FLAG_SHOW_UI)
                  return if (up) "Media volume barha di hai, Sir." else "Media volume kam kar di hai."
              }

              fun lockScreen(): String {
                  return if (devicePolicyManager.isAdminActive(adminComponent)) {
                      devicePolicyManager.lockNow()
                      "Screen lock kar di gayi hai, Sir."
                  } else {
                      val intent = Intent(DevicePolicyManager.ACTION_ADD_DEVICE_ADMIN).apply {
                          putExtra(DevicePolicyManager.EXTRA_DEVICE_ADMIN, adminComponent)
                          putExtra(DevicePolicyManager.EXTRA_ADD_EXPLANATION, "JARVIS ko voice par screen lock karne ki ijazat dein.")
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      }
                      context.startActivity(intent)
                      "Device Admin permission open kar di hai. Allow karein, Sir."
                  }
              }

              fun getTimeAndDate(): String {
                  val time = SimpleDateFormat("hh:mm a", Locale.getDefault()).format(Date())
                  val date = SimpleDateFormat("EEEE, dd MMMM yyyy", Locale.getDefault()).format(Date())
                  return "Sir, is waqt time hai $time aur tareekh hai $date."
              }

              fun openApplication(appName: String): String {
                  val pm = context.packageManager
                  val pkg = when (appName.lowercase()) {
                      "youtube" -> "com.google.android.youtube"
                      "whatsapp" -> "com.whatsapp"
                      "settings" -> "com.android.settings"
                      else -> null
                  }
                  return if (pkg != null) {
                      val intent = pm.getLaunchIntentForPackage(pkg)
                      if (intent != null) {
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          context.startActivity(intent)
                          "$appName open ho raha hai, Sir."
                      } else "$appName phone mein install nahi mila."
                  } else "Application open nahi ho saki."
              }
          }
          EOF

          # 9. WhatsAppManager.kt
          cat << 'EOF' > app/src/main/java/com/jarvis/ultimate/engine/WhatsAppManager.kt
          package com.jarvis.ultimate.engine
          import android.content.Context
          import android.content.Intent
          import android.database.Cursor
          import android.net.Uri
          import android.provider.ContactsContract
          import java.net.URLEncoder

          data class ContactRecord(val name: String, val phone: String)

          class WhatsAppManager(private val context: Context) {
              fun searchContact(query: String): ContactRecord? {
                  val uri = ContactsContract.CommonDataKinds.Phone.CONTENT_URI
                  val projection = arrayOf(ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME, ContactsContract.CommonDataKinds.Phone.NUMBER)
                  val selection = "${ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME} LIKE ?"
                  try {
                      val cursor: Cursor? = context.contentResolver.query(uri, projection, selection, arrayOf("%$query%"), null)
                      cursor?.use {
                          if (it.moveToNext()) {
                              val name = it.getString(0) ?: query
                              var phone = it.getString(1)?.replace(" ", "")?.replace("-", "") ?: ""
                              if (phone.startsWith("03")) phone = "+92" + phone.substring(1)
                              return ContactRecord(name, phone)
                          }
                      }
                  } catch (e: Exception) { }
                  return null
              }

              fun openWhatsAppChatWithText(phone: String, text: String): String {
                  return try {
                      val clean = phone.replace("+", "").replace(" ", "")
                      val enc = URLEncoder.encode(text, "UTF-8")
                      val intent = Intent(Intent.ACTION_VIEW, Uri.parse("https://api.whatsapp.com/send?phone=$clean&text=$enc")).apply {
                          setPackage("com.whatsapp")
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      }
                      context.startActivity(intent)
                      "WhatsApp chat open ho gayi hai. Send press karein, Sir."
                  } catch (e: Exception) { "WhatsApp open nahi ho saka." }
              }

              fun openWhatsAppCall(phone: String, isVideo: Boolean): String {
                  return try {
                      val clean = phone.replace("+", "").replace(" ", "")
                      val intent = Intent(Intent.ACTION_VIEW, Uri.parse("https://api.whatsapp.com/send?phone=$clean")).apply {
                          setPackage("com.whatsapp")
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      }
                      context.startActivity(intent)
                      val type = if (isVideo) "video call" else "voice call"
                      "$type ke liye WhatsApp contact open ho gaya hai."
                  } catch (e: Exception) { "WhatsApp call screen open nahi ho saki." }
              }

              fun makeCellularCall(phone: String) {
                  val intent = Intent(Intent.ACTION_CALL, Uri.parse("tel:$phone")).apply {
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  }
                  try { context.startActivity(intent) } catch (e: SecurityException) {
                      val dial = Intent(Intent.ACTION_DIAL, Uri.parse("tel:$phone")).apply {
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      }
                      context.startActivity(dial)
                  }
              }
          }
          EOF

          # 10. AiBrain.kt
          cat << 'EOF' > app/src/main/java/com/jarvis/ultimate/engine/AiBrain.kt
          package com.jarvis.ultimate.engine
          import com.google.gson.Gson
          import com.google.gson.JsonObject
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody.Companion.toRequestBody
          import java.util.concurrent.TimeUnit

          class AiBrain {
              var apiKey: String = ""
              var endpoint: String = "https://api.openai.com/v1/chat/completions"
              private val client = OkHttpClient.Builder().connectTimeout(15, TimeUnit.SECONDS).readTimeout(25, TimeUnit.SECONDS).build()
              private val gson = Gson()

              suspend fun consult(query: String): String = withContext(Dispatchers.IO) {
                  if (apiKey.isBlank()) {
                      return@withContext "Sir, settings icon tap kar ke apni API key enter karein taake main baat kar sakoon."
                  }
                  val jsonBody = """
                      {
                          "model": "gpt-4o-mini",
                          "messages": [
                              {
                                  "role": "system",
                                  "content": "You are JARVIS AI ULTIMATE, personal assistant for a Pakistani user. Address user as Sir or Bhai. Speak in natural Pakistani Urdu or Roman Urdu. Keep responses concise and loyal."
                              },
                              { "role": "user", "content": "$query" }
                          ],
                          "max_tokens": 250
                      }
                  """.trimIndent()

                  val request = Request.Builder()
                      .url(endpoint)
                      .addHeader("Authorization", "Bearer $apiKey")
                      .addHeader("Content-Type", "application/json")
                      .post(jsonBody.toRequestBody("application/json".toMediaType()))
                      .build()

                  try {
                      val response = client.newCall(request).execute()
                      val body = response.body?.string().orEmpty()
                      if (response.isSuccessful) {
                          val parsed = gson.fromJson(body, JsonObject::class.java)
                          return@withContext parsed.getAsJsonArray("choices").get(0).asJsonObject.getAsJsonObject("message").get("content").asString.trim()
                      } else { "AI error: Code ${response.code}" }
                  } catch (e: Exception) { "Internet connection issue, Sir." }
              }
          }
          EOF

          # 11. MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/jarvis/ultimate/MainActivity.kt
          package com.jarvis.ultimate
          import android.Manifest
          import android.content.Context
          import android.content.Intent
          import android.content
