name: Generate JARVIS Project and Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate All JARVIS Project Source Files
        run: |
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/java/com/jarvis/ultimate/admin
          mkdir -p app/src/main/java/com/jarvis/ultimate/engine

          # 1. Root build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          # 2. settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "JarvisAIUltimate"
          include(":app")
          EOF

          # 3. app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.jarvis.ultimate"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.jarvis.ultimate"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"

                  vectorDrawables {
                      useSupportLibrary = true
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
                  debug {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.8"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.02.00")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("com.google.code.gson:gson:2.10.1")
          }
          EOF

          # 4. XML Resources
          cat << 'EOF' > app/src/main/res/xml/device_admin_sample.xml
          <device-admin xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-policies>
                  <force-lock />
              </uses-policies>
          </device-admin>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">JARVIS AI ULTIMATE</string>
              <string name="device_admin_label">JARVIS Screen Lock</string>
              <string name="device_admin_description">Urdu command par screen lock karne ki authority.</string>
          </resources>
          EOF

          # 5. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.FLASHLIGHT" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.CALL_PHONE" />

              <queries>
                  <package android:name="com.whatsapp" />
                  <package android:name="com.whatsapp.w4b" />
                  <package android:name="com.google.android.youtube" />
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.DIAL" />
                  </intent>
              </queries>

              <application
                  android:name=".JarvisApplication"
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_dialog_info"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".admin.JarvisDeviceAdminReceiver"
                      android:description="@string/device_admin_description"
                      android:label="@string/device_admin_label"
                      android:permission="android.permission.BIND_DEVICE_ADMIN"
                      android:exported="true">
                      <meta-data
                          android:name="android.app.device_admin"
                          android:resource="@xml/device_admin_sample" />
                      <intent-filter>
                          <action android:name="android.app.action.DEVICE_ADMIN_ENABLED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          # 6. JarvisApplication.kt
          cat << 'EOF' > app/src/main/java/com/jarvis/ultimate/JarvisApplication.kt
          package com.jarvis.ultimate
          import android.app.Application
          class JarvisApplication : Application()
          EOF

          # 7. JarvisDeviceAdminReceiver.kt
          cat << 'EOF' > app/src/main/java/com/jarvis/ultimate/admin/JarvisDeviceAdminReceiver.kt
          package com.jarvis.ultimate.admin
          import android.app.admin.DeviceAdminReceiver
          import android.content.Context
          import android.content.Intent
          import android.widget.Toast
          class JarvisDeviceAdminReceiver : DeviceAdminReceiver() {
              override fun onEnabled(context: Context, intent: Intent) {
                  Toast.makeText(context, "JARVIS Screen Lock Enabled", Toast.LENGTH_SHORT).show()
              }
          }
          EOF

          # 8. DeviceController.kt
          cat << 'EOF' > app/src/main/java/com/jarvis/ultimate/engine/DeviceController.kt
          package com.jarvis.ultimate.engine
          import android.app.admin.DevicePolicyManager
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CameraManager
          import android.media.AudioManager
          import com.jarvis.ultimate.admin.JarvisDeviceAdminReceiver
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class DeviceController(private val context: Context) {
              private val cameraManager = context.getSystemService(Context.CAMERA_SERVICE) as CameraManager
              private val audioManager = context.getSystemService(Context.AUDIO_SERVICE) as AudioManager
              private val devicePolicyManager = context.getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
              private val adminComponent = ComponentName(context, JarvisDeviceAdminReceiver::class.java)

              fun toggleFlashlight(turnOn: Boolean): String {
                  return try {
                      val id = cameraManager.cameraIdList.firstOrNull {
                          cameraManager.getCameraCharacteristics(it).get(CameraCharacteristics.FLASH_INFO_AVAILABLE) == true
                      } ?: return "Camera flash nahi mila, Sir."
                      cameraManager.setTorchMode(id, turnOn)
                      if (turnOn) "Flashlight on kar di gayi hai, Sir." else "Flashlight band kar di gayi hai."
                  } catch (e: Exception) { "Flashlight error: ${e.localizedMessage}" }
              }

              fun adjustVolume(up: Boolean): String {
                  val dir = if (up) AudioManager.ADJUST_RAISE else AudioManager.ADJUST_LOWER
                  audioManager.adjustStreamVolume(AudioManager.STREAM_MUSIC, dir, AudioManager.FLAG_SHOW_UI)
                  return if (up) "Media volume barha di hai, Sir." else "Media volume kam kar di hai."
              }

              fun lockScreen(): String {
                  return if (devicePolicyManager.isAdminActive(adminComponent)) {
                      devicePolicyManager.lockNow()
                      "Screen lock kar di gayi hai, Sir."
                  } else {
                      val intent = Intent(DevicePolicyManager.ACTION_ADD_DEVICE_ADMIN).apply {
                          putExtra(DevicePolicyManager.EXTRA_DEVICE_ADMIN, adminComponent)
                          putExtra(DevicePolicyManager.EXTRA_ADD_EXPLANATION, "JARVIS ko voice par screen lock karne ki ijazat dein.")
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      }
                      context.startActivity(intent)
                      "Device Admin permission open kar di hai. Allow karein, Sir."
                  }
              }

              fun getTimeAndDate(): String {
                  val time = SimpleDateFormat("hh:mm a", Locale.getDefault()).format(Date())
                  val date = SimpleDateFormat("EEEE, dd MMMM yyyy", Locale.getDefault()).format(Date())
                  return "Sir, is waqt time hai $time aur tareekh hai $date."
              }

              fun openApplication(appName: String): String {
                  val pm = context.packageManager
                  val pkg = when (appName.lowercase()) {
                      "youtube" -> "com.google.android.youtube"
                      "whatsapp" -> "com.whatsapp"
                      "settings" -> "com.android.settings"
                      else -> null
                  }
                  return if (pkg != null) {
                      val intent = pm.getLaunchIntentForPackage(pkg)
                      if (intent != null) {
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          context.startActivity(intent)
                          "$appName open ho raha hai, Sir."
                      } else "$appName phone mein install nahi mila."
                  } else "Application open nahi ho saki."
              }
          }
          EOF

          # 9. WhatsAppManager.kt
          cat << 'EOF' > app/src/main/java/com/jarvis/ultimate/engine/WhatsAppManager.kt
          package com.jarvis.ultimate.engine
          import android.content.Context
          import android.content.Intent
          import android.database.Cursor
          import android.net.Uri
          import android.provider.ContactsContract
          import java.net.URLEncoder

          data class ContactRecord(val name: String, val phone: String)

          class WhatsAppManager(private val context: Context) {
              fun searchContact(query: String): ContactRecord? {
                  val uri = ContactsContract.CommonDataKinds.Phone.CONTENT_URI
                  val projection = arrayOf(ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME, ContactsContract.CommonDataKinds.Phone.NUMBER)
                  val selection = "${ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME} LIKE ?"
                  try {
                      val cursor: Cursor? = context.contentResolver.query(uri, projection, selection, arrayOf("%$query%"), null)
                      cursor?.use {
                          if (it.moveToNext()) {
                              val name = it.getString(0) ?: query
                              var phone = it.getString(1)?.replace(" ", "")?.replace("-", "") ?: ""
                              if (phone.startsWith("03")) phone = "+92" + phone.substring(1)
                              return ContactRecord(name, phone)
                          }
                      }
                  } catch (e: Exception) { }
                  return null
              }

              fun openWhatsAppChatWithText(phone: String, text: String): String {
                  return try {
                      val clean = phone.replace("+", "").replace(" ", "")
                      val enc = URLEncoder.encode(text, "UTF-8")
                      val intent = Intent(Intent.ACTION_VIEW, Uri.parse("https://api.whatsapp.com/send?phone=$clean&text=$enc")).apply {
                          setPackage("com.whatsapp")
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      }
                      context.startActivity(intent)
                      "WhatsApp chat open ho gayi hai. Send press karein, Sir."
                  } catch (e: Exception) { "WhatsApp open nahi ho saka." }
              }

              fun openWhatsAppCall(phone: String, isVideo: Boolean): String {
                  return try {
                      val clean = phone.replace("+", "").replace(" ", "")
                      val intent = Intent(Intent.ACTION_VIEW, Uri.parse("https://api.whatsapp.com/send?phone=$clean")).apply {
                          setPackage("com.whatsapp")
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      }
                      context.startActivity(intent)
                      val type = if (isVideo) "video call" else "voice call"
                      "$type ke liye WhatsApp contact open ho gaya hai."
                  } catch (e: Exception) { "WhatsApp call screen open nahi ho saki." }
              }

              fun makeCellularCall(phone: String) {
                  val intent = Intent(Intent.ACTION_CALL, Uri.parse("tel:$phone")).apply {
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  }
                  try { context.startActivity(intent) } catch (e: SecurityException) {
                      val dial = Intent(Intent.ACTION_DIAL, Uri.parse("tel:$phone")).apply {
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      }
                      context.startActivity(dial)
                  }
              }
          }
          EOF

          # 10. AiBrain.kt
          cat << 'EOF' > app/src/main/java/com/jarvis/ultimate/engine/AiBrain.kt
          package com.jarvis.ultimate.engine
          import com.google.gson.Gson
          import com.google.gson.JsonObject
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody.Companion.toRequestBody
          import java.util.concurrent.TimeUnit

          class AiBrain {
              var apiKey: String = ""
              var endpoint: String = "https://api.openai.com/v1/chat/completions"
              private val client = OkHttpClient.Builder().connectTimeout(15, TimeUnit.SECONDS).readTimeout(25, TimeUnit.SECONDS).build()
              private val gson = Gson()

              suspend fun consult(query: String): String = withContext(Dispatchers.IO) {
                  if (apiKey.isBlank()) {
                      return@withContext "Sir, settings icon tap kar ke apni API key enter karein taake main baat kar sakoon."
                  }
                  val jsonBody = """
                      {
                          "model": "gpt-4o-mini",
                          "messages": [
                              {
                                  "role": "system",
                                  "content": "You are JARVIS AI ULTIMATE, personal assistant for a Pakistani user. Address user as Sir or Bhai. Speak in natural Pakistani Urdu or Roman Urdu. Keep responses concise and loyal."
                              },
                              { "role": "user", "content": "$query" }
                          ],
                          "max_tokens": 250
                      }
                  """.trimIndent()

                  val request = Request.Builder()
                      .url(endpoint)
                      .addHeader("Authorization", "Bearer $apiKey")
                      .addHeader("Content-Type", "application/json")
                      .post(jsonBody.toRequestBody("application/json".toMediaType()))
                      .build()

                  try {
                      val response = client.newCall(request).execute()
                      val body = response.body?.string().orEmpty()
                      if (response.isSuccessful) {
                          val parsed = gson.fromJson(body, JsonObject::class.java)
                          return@withContext parsed.getAsJsonArray("choices").get(0).asJsonObject.getAsJsonObject("message").get("content").asString.trim()
                      } else { "AI error: Code ${response.code}" }
                  } catch (e: Exception) { "Internet connection issue, Sir." }
              }
          }
          EOF

          # 11. MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/jarvis/ultimate/MainActivity.kt
          package com.jarvis.ultimate
          import android.Manifest
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.animation.core.*
          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Mic
          import androidx.compose.material.icons.filled.Replay
          import androidx.compose.material.icons.filled.Send
          import androidx.compose.material.icons.filled.Settings
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.window.Dialog
          import androidx.core.content.ContextCompat
          import androidx.lifecycle.lifecycleScope
          import com.jarvis.ultimate.engine.AiBrain
          import com.jarvis.ultimate.engine.DeviceController
          import com.jarvis.ultimate.engine.WhatsAppManager
          import kotlinx.coroutines.launch
          import java.util.Locale
          import kotlin.math.cos
          import kotlin.math.sin

          data class ChatItem(val sender: String, val message: String)

          class MainActivity : ComponentActivity(), TextToSpeech.OnInitListener {
              private lateinit var tts: TextToSpeech
              private var speechRecognizer: SpeechRecognizer? = null
              private lateinit var deviceController: DeviceController
              private lateinit var whatsAppManager: WhatsAppManager
              private val aiBrain = AiBrain()

              private val chatLog = mutableStateListOf<ChatItem>()
              private var isListening = mutableStateOf(false)
              private var isThinking = mutableStateOf(false)
              private var isMale = mutableStateOf(true)
              private var lastSpeech = ""

              private val permissionLauncher = registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) { }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  deviceController = DeviceController(this)
                  whatsAppManager = WhatsAppManager(this)
                  tts = TextToSpeech(this, this)

                  requestPerms()
                  initRecognizer()

                  val prefs = getSharedPreferences("jarvis_cfg", Context.MODE_PRIVATE)
                  aiBrain.apiKey = prefs.getString("k", "") ?: ""
                  isMale.value = prefs.getBoolean("m", true)

                  chatLog.add(ChatItem("JARVIS", "Main online hoon, Sir. Hukum karein."))

                  setContent {
                      var showSettings by remember { mutableStateOf(false) }
                      MaterialTheme(colorScheme = darkColorScheme(background = Color(0xFF040911))) {
                          Scaffold(
                              topBar = {
                                  Row(
                                      modifier = Modifier.fillMaxWidth().background(Color(0xFF060E1A)).padding(16.dp),
                                      horizontalArrangement = Arrangement.SpaceBetween,
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      Text("JARVIS AI ULTIMATE", color = Color(0xFF00E5FF), style = MaterialTheme.typography.titleMedium)
                                      Row {
                                          IconButton(onClick = { if (lastSpeech.isNotBlank()) speak(lastSpeech) }) {
                                              Icon(Icons.Default.Replay, "Repeat", tint = Color(0xFF00E5FF))
                                          }
                                          IconButton(onClick = { showSettings = true }) {
                                              Icon(Icons.Default.Settings, "Settings", tint = Color(0xFF00E5FF))
                                          }
                                      }
                                  }
                              },
                              containerColor = Color(0xFF040911)
                          ) { pad ->
                              Column(modifier = Modifier.fillMaxSize().padding(pad), horizontalAlignment = Alignment.CenterHorizontally) {
                                  Spacer(modifier = Modifier.height(10.dp))
                                  ArcReactor(isListening.value, isThinking.value) {
                                      if (isListening.value) stopListen() else startListen()
                                  }
                                  Spacer(modifier = Modifier.height(10.dp))
                                  LazyColumn(modifier = Modifier.weight(1f).fillMaxWidth().padding(horizontal = 16.dp)) {
                                      items(chatLog) { item ->
                                          val isUser = item.sender == "USER"
                                          Column(modifier = Modifier.fillMaxWidth(), horizontalAlignment = if (isUser) Alignment.End else Alignment.Start) {
                                              Box(
                                                  modifier = Modifier.padding(vertical = 4.dp).clip(RoundedCornerShape(12.dp))
                                                      .background(if (isUser) Color(0xFF0E2238) else Color(0xFF003840))
                                                      .border(1.dp, Color(0xFF00E5FF).copy(alpha = 0.4f), RoundedCornerShape(12.dp))
                                                      .padding(12.dp)
                                              ) {
                                                  Text(item.message, color = Color(0xFFE0F7FA))
                                              }
                                          }
                                      }
                                  }
                                  var textInput by remember { mutableStateOf("") }
                                  Row(modifier = Modifier.fillMaxWidth().background(Color(0xFF091424)).padding(8.dp), verticalAlignment = Alignment.CenterVertically) {
                                      TextField(
                                          value = textInput,
                                          onValueChange = { textInput = it },
                                          modifier = Modifier.weight(1f),
                                          placeholder = { Text("Command dein...", color = Color.Gray) },
                                          colors = TextFieldDefaults.colors(focusedTextColor = Color.White, unfocusedTextColor = Color.White)
                                      )
                                      IconButton(onClick = {
                                          if (textInput.isNotBlank()) { val q = textInput; textInput = ""; handleInput(q) }
                                      }) { Icon(Icons.Default.Send, "Send", tint = Color(0xFF00E5FF)) }
                                      FloatingActionButton(
                                          onClick = { if (isListening.value) stopListen() else startListen() },
                                          containerColor = if (isListening.value) Color(0xFFFFB300) else Color(0xFF00E5FF),
                                          modifier = Modifier.size(48.dp)
                                      ) { Icon(Icons.Default.Mic, "Mic", tint = Color.Black) }
                                  }
                              }

                              if (showSettings) {
                                  SettingsModal(aiBrain.apiKey, isMale.value, onSave = { k, m ->
                                      aiBrain.apiKey = k; isMale.value = m
                                      prefs.edit().putString("k", k).putBoolean("m", m).apply()
                                      applyTone(m); showSettings = false
                                  }, onDismiss = { showSettings = false })
                              }
                          }
                      }
                  }
              }

              private fun requestPerms() {
                  val perms = arrayOf(Manifest.permission.RECORD_AUDIO, Manifest.permission.READ_CONTACTS, Manifest.permission.CALL_PHONE, Manifest.permission.CAMERA)
                  permissionLauncher.launch(perms)
              }

              private fun initRecognizer() {
                  if (SpeechRecognizer.isRecognitionAvailable(this)) {
                      speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this).apply {
                          setRecognitionListener(object : RecognitionListener {
                              override fun onReadyForSpeech(p: Bundle?) { isListening.value = true }
                              override fun onEndOfSpeech() { isListening.value = false }
                              override fun onError(e: Int) { isListening.value = false }
                              override fun onResults(r: Bundle?) {
                                  isListening.value = false
                                  val text = r?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()
                                  if (!text.isNullOrBlank()) handleInput(text)
                              }
                              override fun onBeginningOfSpeech() {}
                              override fun onRmsChanged(r: Float) {}
                              override fun onBufferReceived(b: ByteArray?) {}
                              override fun onPartialResults(p: Bundle?) {}
                              override fun onEvent(t: Int, p: Bundle?) {}
                          })
                      }
                  }
              }

              private fun startListen() {
                  val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE, "ur-PK")
                  }
                  try { speechRecognizer?.startListening(intent); isListening.value = true } catch (e: Exception) { isListening.value = false }
              }

              private fun stopListen() { speechRecognizer?.stopListening(); isListening.value = false }

              private fun handleInput(input: String) {
                  chatLog.add(ChatItem("USER", input))
                  val lower = input.lowercase(Locale.ROOT)

                  if (lower.contains("lock") || lower.contains("لاک")) { respond(deviceController.lockScreen()); return }
                  if (lower.contains("flashlight") || lower.contains("torch") || lower.contains("ٹارچ")) {
                      val on = !(lower.contains("band") || lower.contains("off")); respond(deviceController.toggleFlashlight(on)); return
                  }
                  if (lower.contains("volume") || lower.contains("awaz") || lower.contains("آواز")) {
                      val up = lower.contains("barhao") || lower.contains("tez") || lower.contains("up"); respond(deviceController.adjustVolume(up)); return
                  }
                  if (lower.contains("time") || lower.contains("waqt") || lower.contains("date") || lower.contains("وقت")) {
                      respond(deviceController.getTimeAndDate()); return
                  }
                  if (lower.contains("youtube")) { respond(deviceController.openApplication("youtube")); return }
                  if (lower.contains("whatsapp") || lower.contains("واٹس ایپ")) {
                      val isVideo = lower.contains("video"); val isCall = lower.contains("call") || lower.contains("کال")
                      val words = lower.split(" ")
                      val name = words.firstOrNull { it != "jarvis" && it != "whatsapp" && it != "ko" && it != "call" && it != "message" } ?: ""
                      val contact = whatsAppManager.searchContact(name)
                      if (contact != null) {
                          if (isCall) respond(whatsAppManager.openWhatsAppCall(contact.phone, isVideo))
                          else {
                              val body = if (lower.contains("ke")) lower.substringAfter("ke") else "Assalam-o-Alaikum"
                              respond(whatsAppManager.openWhatsAppChatWithText(contact.phone, body))
                          }
                      } else { respond("WhatsApp open kiya ja raha hai, Sir."); deviceController.openApplication("whatsapp") }
                      return
                  }
                  if (lower.startsWith("call") || lower.contains("call karo")) {
                      val words = lower.split(" ")
                      val name = words.firstOrNull { it != "jarvis" && it != "ko" && it != "call" && it != "karo" } ?: ""
                      val contact = whatsAppManager.searchContact(name)
                      if (contact != null) {
                          respond("${contact.name} ko call milai ja rahi hai, Sir."); whatsAppManager.makeCellularCall(contact.phone)
                      } else respond("Contact list mein '$name' nahi mila.")
                      return
                  }

                  isThinking.value = true
                  lifecycleScope.launch {
                      val ans = aiBrain.consult(input)
                      isThinking.value = false
                      respond(ans)
                  }
              }

              private fun respond(text: String) {
                  lastSpeech = text
                  chatLog.add(ChatItem("JARVIS", text))
                  speak(text)
              }

              private fun speak(text: String) { tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "JARVIS_VOICE") }

              private fun applyTone(male: Boolean) { tts.setPitch(if (male) 0.82f else 1.30f) }

              override fun onInit(s: Int) {
                  if (s == TextToSpeech.SUCCESS) {
                      val r = tts.setLanguage(Locale("ur", "PK"))
                      if (r == TextToSpeech.LANG_MISSING_DATA || r == TextToSpeech.LANG_NOT_SUPPORTED) tts.setLanguage(Locale("hi", "IN"))
                      applyTone(isMale.value)
                  }
              }

              override fun onDestroy() { super.onDestroy(); speechRecognizer?.destroy(); tts.stop(); tts.shutdown() }
          }

          @Composable
          fun ArcReactor(listening: Boolean, thinking: Boolean, onClick: () -> Unit) {
              val tr = rememberInfiniteTransition(label = "arc")
              val angle by tr.animateFloat(0f, 360f, infiniteRepeatable(tween(7000, easing = LinearEasing)), label = "spin")
              val clr = when { thinking -> Color(0xFFFFB300); listening -> Color(0xFF00FF9D); else -> Color(0xFF00E5FF) }

              Box(modifier = Modifier.size(160.dp).clickable { onClick() }, contentAlignment = Alignment.Center) {
                  Canvas(modifier = Modifier.size(140.dp)) {
                      val c = Offset(size.width / 2, size.height / 2); val r = size.width / 2.2f
                      drawCircle(Brush.radialGradient(listOf(clr.copy(0.35f), Color.Transparent), c, r * 1.3f))
                      drawCircle(clr, r, style = Stroke(3.dp.toPx()))
                      for (i in 0 until 10) {
                          val rad = Math.toRadians((i * 36 + angle).toDouble())
                          drawLine(clr, Offset(c.x + (r * 0.7f) * cos(rad).toFloat(), c.y + (r * 0.7f) * sin(rad).toFloat()), Offset(c.x + (r * 0.95f) * cos(rad).toFloat(), c.y + (r * 0.95f) * sin(rad).toFloat()), 3.dp.toPx())
                      }
                      drawCircle(clr.copy(0.8f), r * 0.4f); drawCircle(Color.White, r * 0.2f)
                  }
              }
          }

          @Composable
          fun SettingsModal(currentKey: String, isMale: Boolean, onSave: (String, Boolean) -> Unit, onDismiss: () -> Unit) {
              var k by remember { mutableStateOf(currentKey) }; var m by remember { mutableStateOf(isMale) }
              Dialog(onDismissRequest = onDismiss) {
                  Box(modifier = Modifier.fillMaxWidth().clip(RoundedCornerShape(16.dp)).background(Color(0xFF0E1A2C)).border(1.dp, Color(0xFF00E5FF), RoundedCornerShape(16.dp)).padding(20.dp)) {
                      Column {
                          Text("JARVIS Settings", color = Color(0xFF00E5FF), style = MaterialTheme.typography.titleMedium)
                          Spacer(modifier = Modifier.height(10.dp))
                          Text("OpenAI / Groq API Key (Optional):", color = Color.White)
                          TextField(value = k, onValueChange = { k = it }, colors = TextFieldDefaults.colors(focusedTextColor = Color.White, unfocusedTextColor = Color.White))
                          Spacer(modifier = Modifier.height(10.dp))
                          Row {
                              FilterChip(selected = m, onClick = { m = true }, label = { Text("Male (Jarvis)") })
                              Spacer(modifier = Modifier.width(8.dp))
                              FilterChip(selected = !m, onClick = { m = false }, label = { Text("Female (Urdu)") })
                          }
                          Spacer(modifier = Modifier.height(16.dp))
                          Button(onClick = { onSave(k, m) }, modifier = Modifier.fillMaxWidth(), colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF00E5FF))) {
                              Text("SAVE", color = Color.Black)
                          }
                      }
                  }
              }
          }
          EOF

      - name: Create Complete Project ZIP Archive
        run: |
          zip -r jarvis-complete-project.zip . -x ".git/*" -x ".github/*"

      - name: Upload Complete Project ZIP File
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-complete-source-code-zip
          path: jarvis-complete-project.zip

      - name: Generate Gradle Wrapper
        run: gradle wrapper

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Compile and Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
